[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "item-build"
version = "0.1.0"
description = "Tri thức có dẫn nguồn cho Liên Quân Mobile Việt Nam"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "rapidfuzz>=3.13,<4", "httpx>=0.28,<1"]

[project.scripts]
item-build = "item_build.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "tiktoken>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
